# Alembic configuration. `sqlalchemy.url` is intentionally absent: alembic/env.py takes the URL
# from kanban.config.Settings (Section 6.12), and the lifespan/CLI set it programmatically on an
# absolute Config so `alembic upgrade head` behaves identically from any working directory.
[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.20 replaced version_path_separator with path_separator, which also governs how
# prepend_sys_path is split; "os" keeps the Windows path in this repo from splitting on its colon.
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
