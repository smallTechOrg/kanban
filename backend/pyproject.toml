[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanban"
version = "3.0.0"
description = "My Day - a self-hosted board for everything you are keeping track of (API + SPA host)."
requires-python = ">=3.12"
license = { text = "MIT" }

# Versions come from the Section 1.5 stack table of docs/PLANNING.md.
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "httpx>=0.27",
  "hypothesis>=6.112",
  "ruff>=0.6",
]

[project.scripts]
kanban = "kanban.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kanban*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# conftest configures KANBAN_* before importing the package, so its imports cannot be at the top.
"tests/conftest.py" = ["E402"]
# Alembic's generated scaffolding keeps its own module-level conventions.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kanban"]
# The `backend/alembic/` migrations directory makes ruff infer that the third-party `alembic`
# distribution is first-party code; say otherwise so its imports stay in the third-party group.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The CLAUDE.md section 6 coverage gate on `kanban/`, live from M1 onwards.
addopts = "-q --strict-markers --cov=kanban --cov-report=term-missing --cov-fail-under=85"
