# ---------------------------------------------------------------------------
# Kan Ban CI. The commands here mirror the root npm scripts (package.json) but
# are spelled out with the runner's own interpreter, because CI installs into
# the job's Python rather than the repo's .venv.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: python -m pip install -e "backend[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check backend

      - name: Format check (ruff format --check)
        run: python -m ruff format --check backend

      - name: Test (pytest)
        run: python -m pytest backend/tests

  web:
    name: web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend toolchain
        run: npm ci --prefix frontend

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck --prefix frontend

      - name: Lint (eslint + prettier)
        run: npm run lint --prefix frontend

      - name: Test (vitest)
        run: npm run test --prefix frontend

      - name: Build (vite build)
        run: npm run build --prefix frontend

  # Playwright end-to-end suite: the golden paths of CLAUDE.md section 6, run against a real
  # server on :8020 with a throwaway data directory, exactly as e2e/playwright.config.ts
  # documents (the config has no `webServer` block, so the job starts one itself).
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend with dev extras
        run: python -m pip install -e "backend[dev]"

      - name: Install toolchains
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build the SPA
        run: npm run build --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # A throwaway data directory per run: the specs create their own boards and there is no
      # account to set up, so a fresh database is the whole fixture.
      - name: Start the server
        run: |
          KANBAN_PORT=8020 KANBAN_DATA_DIR=./.tmp-verify python -m kanban &
          curl -sS --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8020/api/health

      - name: Run Playwright
        run: npx playwright test -c e2e/playwright.config.ts

      - name: Upload the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
