<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="My Day">
  <!-- Brand mark: a day's three lines, longest first. The literal below mirrors --logo in
       src/styles/tokens.css; a static asset cannot read a CSS custom property, and Section 1.7
       of the plan pins this file. -->
  <rect width="32" height="32" rx="10" fill="#4C3FB5" />
  <rect x="7" y="9" width="18" height="4" rx="2" fill="#FFFFFF" />
  <rect x="7" y="16" width="13" height="4" rx="2" fill="#FFFFFF" />
  <rect x="7" y="23" width="8" height="4" rx="2" fill="#FFFFFF" />
</svg>
